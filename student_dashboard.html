<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWDSMS | Student Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  transition:.3s;
}

body{
  margin:0;
  display:flex;
  background:#f4f5fb;
}

/* ========== SIDEBAR ========== */
.sidebar{
  width:250px;
  height:100vh;
  background:#fff;
  padding:25px 20px;
  box-shadow:2px 0 15px rgba(0,0,0,.05);
  display:flex;
  flex-direction:column;
}

.sidebar h2{
  text-align:center;
  color:#6366F1;
  margin-bottom:30px;
}

.user-box{
  background:#f3f4f6;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  margin-bottom:25px;
}

.user-box strong{
  color:#6366F1;
  display:block;
  margin-bottom:5px;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 15px;
  color:#374151;
  text-decoration:none;
  border-radius:10px;
  margin-bottom:12px;
  font-size:15px;
}

.sidebar a:hover,
.sidebar a.active{
  background:#6366F1;
  color:white;
}

.sidebar a.logout{
  margin-top:auto;
  border-top:1px solid #e5e7eb;
  padding-top:15px;
}

/* ========== MAIN ========== */
.main{
  flex:1;
  padding:30px 40px;
}

/* ========== TOP BAR ========== */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.top h1{
  font-size:24px;
  color:#111827;
}

.top button{
  background:#6366F1;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:12px;
  cursor:pointer;
}

.top button:hover{
  background:#4f46e5;
}

/* ========== STATS ========== */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.stat{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
  text-align:center;
}

.stat p{
  margin:0;
  font-size:14px;
  color:#4b5563;
}

.stat span{
  font-size:32px;
  font-weight:600;
  color:#6366F1;
}

/* ========== TABLE ========== */
.table-card{
  background:white;
  padding:25px 30px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.table-card h3{
  margin-top:0;
}

.table-card input{
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  width:300px;
  max-width:100%;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
}

th{
  background:#f9fafb;
}

tbody tr:hover{
  background:#f3f4f6;
}

/* ========== FOOTER ========== */
.footer{
  text-align:center;
  margin-top:40px;
  font-size:12px;
  color:#9ca3af;
}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  .sidebar{width:200px;}
  .main{padding:20px;}
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>SWDSMS</h2>

  <a href="student_dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Student Dashboard</a>
  <a href="submit-report.html"><i class="fas fa-file-alt"></i> Submit Report</a>
  <a href="report-history.html"><i class="fas fa-history"></i> Report History</a>

  <a class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <div class="top">
    <h1>Student Dashboard</h1>
    <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <p>Total Reports</p>
      <span id="total">0</span>
    </div>
    <div class="stat">
      <p>Pending</p>
      <span id="pending">0</span>
    </div>
    <div class="stat">
      <p>Resolved</p>
      <span id="resolved">0</span>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <h3>My Incident Reports</h3>
    <input type="text" placeholder="Search..." onkeyup="searchIncident(this.value)">
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Description</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="incidentTable"></tbody>
    </table>
  </div>

  <div class="footer">
    © 2026 SWDSMS Student Panel
  </div>

</div>

<script>
const SUPABASE_URL = "https://ukovklupzrarwpgcohwk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrb3ZrbHVwenJhcndwZ2NvaHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5ODQ4MzksImV4cCI6MjA4NjU2MDgzOX0.lVz9UC8btgycC_iPlZVNaxkIL4dZ1sM3sAP7P8kCf9E";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let incidents = [];
let currentUser = null;

function renderTable(data){
  const tbody = document.getElementById("incidentTable");
  tbody.innerHTML = "";

  data.forEach(i=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i.type}</td>
      <td>${i.description}</td>
      <td>${i.date}</td>
      <td>${i.status}</td>
    `;
    tbody.appendChild(tr);
  });
}

/* ========== SEARCH ========== */
function searchIncident(value){
  value = value.toLowerCase();
  const filtered = incidents.filter(i =>
    i.type.toLowerCase().includes(value) ||
    i.description.toLowerCase().includes(value)
  );
  renderTable(filtered);
}

/* ========== LOGOUT ========== */
function logout(){
  supabaseClient.auth.signOut();
  localStorage.removeItem("profile");
  alert("Logged out!");
  window.location.href = "login.html";
}
async function loadDashboard(){
  try {
    const session = await supabaseClient.auth.getSession();
    if (!session.data.session || !session.data.session.user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.data.session.user;
    const { data: profile, error: profileError } = await supabaseClient
      .from("profiles")
      .select("id, role")
      .eq("id", currentUser.id)
      .single();

    if (profileError || !profile) {
      alert("Profile not found. Please contact admin.");
      window.location.href = "login.html";
      return;
    }

    if (profile.role !== "student") {
      window.location.href = "login.html";
      return;
    }

    const { data: rows, error } = await supabaseClient
      .from("incidents")
      .select("incident_type, description, incident_date, status")
      .eq("student_id", currentUser.id)
      .order("incident_date", { ascending: false });

    if (error) {
      alert(error.message || "Failed to load incidents.");
      return;
    }

    incidents = (rows || []).map(i => ({
      type: i.incident_type,
      description: i.description,
      date: i.incident_date,
      status: i.status
    }));

    document.getElementById("total").textContent = incidents.length;
    document.getElementById("pending").textContent = incidents.filter(i=>i.status.toLowerCase()==='pending').length;
    document.getElementById("resolved").textContent = incidents.filter(i=>i.status.toLowerCase()==='resolved').length;
    renderTable(incidents);
  } catch (err) {
    alert("Network error. Please try again.");
  }
}

window.onload = loadDashboard;
</script>

</body>
</html>
