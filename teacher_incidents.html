<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWDSMS | Teacher Incidents</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== GENERAL ===== */
*{box-sizing:border-box; font-family:'Poppins',sans-serif; transition:0.3s;}
body{margin:0; display:flex; background:#f4f5fb; min-height:100vh;}

/* ===== SIDEBAR ===== */
#sidebar{
  width:250px; background:white; height:100vh; padding:25px 20px;
  box-shadow:2px 0 15px rgba(0,0,0,.05); display:flex; flex-direction:column;
}
#sidebar h2{color:#6366F1; margin-bottom:40px; font-size:24px; font-weight:600; text-align:center;}
#sidebar a{display:flex; align-items:center; gap:10px; padding:12px 15px; color:#374151; text-decoration:none; border-radius:10px; margin-bottom:12px; font-size:15px;}
#sidebar a i{min-width:20px; text-align:center;}
#sidebar a.active, #sidebar a:hover{background:#6366F1; color:white;}

/* ===== MAIN ===== */
.main{flex:1; padding:30px 40px; overflow-x:hidden;}
.main h1{color:#111827; margin-bottom:20px;}

/* ===== TABLE CARD ===== */
.table-card{background:white; padding:25px 30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,.08);}
.table-card h3{margin-top:0; margin-bottom:15px; color:#111827;}
.table-card input{padding:12px 15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; width:100%; max-width:320px;}

table{width:100%; border-collapse:collapse;}
th,td{padding:12px 15px; border-bottom:1px solid #e5e7eb; font-size:14px; text-align:left; vertical-align:top;}
th{background:#f9fafb; font-weight:600; color:#4b5563;}
tr:hover{background:#f3f4f6;}

.status-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.status-pending{background:#fef3c7; color:#92400e;}
.status-resolved{background:#dcfce7; color:#166534;}

.resolve-btn{
  background:#6366F1;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
}
.resolve-btn:hover{background:#4f46e5;}
.resolve-btn:disabled{background:#c7c7c7; cursor:not-allowed;}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  #sidebar{width:200px;}
  .main{padding:20px 25px;}
}
@media(max-width:600px){
  #sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:15px;}
  .main{padding:15px;}
  .table-card input{max-width:100%;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar"></div>

<!-- MAIN -->
<div class="main">
  <h1>Incident Reports</h1>

  <div class="table-card">
    <h3>My Students' Reports</h3>
    <input type="text" placeholder="Search report..." onkeyup="searchReport(this.value)">
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Grade / Section</th>
          <th>Type</th>
          <th>Incident Date</th>
          <th>Status</th>
          <th>Description</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="incidentTable"></tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ukovklupzrarwpgcohwk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrb3ZrbHVwenJhcndwZ2NvaHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5ODQ4MzksImV4cCI6MjA4NjU2MDgzOX0.lVz9UC8btgycC_iPlZVNaxkIL4dZ1sM3sAP7P8kCf9E";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let incidents = [];

// ===== SIDEBAR =====
let userRole = "teacher";
const sidebarItems = {
  teacher:[
    {name:"Dashboard", icon:"fa-tachometer-alt", link:"teacher_dashboard.html"},
    {name:"Incidents", icon:"fa-file-alt", link:"teacher_incidents.html", active:true},
    {name:"Submit Report", icon:"fa-paper-plane", link:"submit-report.html"},
    {name:"My Students", icon:"fa-users", link:"my-students.html"},
    {name:"Logout", icon:"fa-sign-out-alt", action:"logout"}
  ]
};

function renderSidebar(role){
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = `<h2>SWDSMS</h2>`;
  sidebarItems[role].forEach(item=>{
    const a = document.createElement("a");
    a.href = item.link ? item.link : "#";
    a.innerHTML = `<i class="fas ${item.icon}"></i> ${item.name}`;
    if(item.active) a.classList.add("active");
    if(item.action === "logout") a.onclick = e=>{e.preventDefault(); logout();};
    sidebar.appendChild(a);
  });
}
renderSidebar(userRole);

function formatDate(value){
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString();
}

function statusBadge(status){
  const normalized = (status || "").toLowerCase();
  const cls = normalized === "resolved" ? "status-resolved" : "status-pending";
  const label = status || "Pending";
  return `<span class="status-badge ${cls}">${label}</span>`;
}

function renderIncidents(data){
  const tbody = document.getElementById("incidentTable");
  tbody.innerHTML = "";

  data.forEach(item=>{
    const tr = document.createElement("tr");
    const resolved = (item.status || "").toLowerCase() === "resolved";
    tr.innerHTML = `
      <td>${item.student_name}</td>
      <td>${item.grade_section}</td>
      <td>${item.incident_type}</td>
      <td>${item.incident_date}</td>
      <td>${statusBadge(item.status)}</td>
      <td>${item.description}</td>
      <td>
        <button type="button" class="resolve-btn" ${resolved ? "disabled" : ""} onclick="resolveIncident(event, this, '${item.id}')">
          ${resolved ? "Resolved" : "Mark Resolved"}
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// ===== SEARCH FUNCTION =====
function searchReport(val){
  val = val.toLowerCase();
  const filtered = incidents.filter(i=>{
    return (
      (i.student_name || "").toLowerCase().includes(val) ||
      (i.incident_type || "").toLowerCase().includes(val) ||
      (i.grade_section || "").toLowerCase().includes(val)
    );
  });
  renderIncidents(filtered);
}

// ===== LOGOUT =====
function logout(){
  supabaseClient.auth.signOut();
  localStorage.removeItem("profile");
  alert("Logging out...");
  window.location.href = "login.html";
}

async function resolveIncident(event, button, id){
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  if (!id) return;
  try {
    if (button) {
      button.disabled = true;
      button.textContent = "Resolving...";
    }

    const { data, error } = await supabaseClient
      .from("incidents")
      .update({ status: "Resolved" })
      .eq("id", id)
      .select("id, status");

    if (error) {
      alert(error.message || "Failed to update status.");
      if (button) {
        button.disabled = false;
        button.textContent = "Mark Resolved";
      }
      return;
    }

    if (!data || data.length === 0) {
      alert("Nothing to update. It may already be resolved or you do not have permission.");
      if (button) {
        button.disabled = false;
        button.textContent = "Mark Resolved";
      }
      return;
    }

    const resolvedStatus = data[0].status || "Resolved";
    incidents = incidents.map(item => {
      if (String(item.id) === String(id)) {
        return { ...item, status: resolvedStatus };
      }
      return item;
    });

    renderIncidents(incidents);
  } catch (err) {
    alert("Network error. Please try again.");
    if (button) {
      button.disabled = false;
      button.textContent = "Mark Resolved";
    }
  }
}

async function loadIncidents(){
  try {
    const session = await supabaseClient.auth.getSession();
    if (!session.data.session || !session.data.session.user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = session.data.session.user;
    const { data: profile, error: profileError } = await supabaseClient
      .from("profiles")
      .select("id, role")
      .eq("id", currentUser.id)
      .single();

    if (profileError || !profile) {
      alert("Profile not found. Please contact admin.");
      window.location.href = "login.html";
      return;
    }

    if (profile.role !== "teacher") {
      window.location.href = "login.html";
      return;
    }

    const { data: rows, error } = await supabaseClient
      .from("incidents")
      .select("id, student_name, grade_section, incident_type, incident_date, status, description")
      .order("incident_date", { ascending: false });

    if (error) {
      alert(error.message || "Failed to load incidents.");
      return;
    }

    incidents = (rows || []).map(row => ({
      id: row.id,
      student_name: row.student_name,
      grade_section: row.grade_section,
      incident_type: row.incident_type,
      incident_date: formatDate(row.incident_date),
      status: row.status,
      description: row.description
    }));

    renderIncidents(incidents);
  } catch (err) {
    alert("Network error. Please try again.");
  }
}

window.onload = loadIncidents;
</script>

</body>
</html>
